name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Read-only token by default. Jobs that need more request it explicitly.
permissions:
  contents: read

# Cancel superseded runs on the same ref to save minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typescript:
    name: TypeScript + CDK synth
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint (eslint + prettier)
        run: npm run lint

      - name: Type-check
        run: npx tsc --noEmit

      - name: Unit tests (jest)
        run: npx jest --ci

      - name: CDK synth
        run: npx cdk synth --context stage=ci --quiet

  python:
    name: Python (agent-runtime)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: agent-runtime/requirements.txt

      - name: Install dependencies
        working-directory: agent-runtime
        run: |
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Lint (ruff)
        working-directory: agent-runtime
        run: ruff check .

      - name: Compile-check
        working-directory: agent-runtime
        run: python -m compileall -q .

      - name: Unit tests (pytest)
        working-directory: agent-runtime
        run: python -m pytest
