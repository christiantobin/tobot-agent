name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Read-only token by default. Jobs that need more request it explicitly.
permissions:
  contents: read

# Cancel superseded runs on the same ref to save minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typescript:
    name: TypeScript + CDK synth
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint (eslint + prettier)
        run: npm run lint

      - name: Type-check
        run: npx tsc --noEmit

      - name: Unit tests (jest)
        run: npx jest --ci

      - name: CDK synth
        run: npx cdk synth --context stage=ci --quiet

  python:
    name: Python (agent-runtime)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: agent-runtime/requirements.txt

      - name: Install dependencies
        working-directory: agent-runtime
        run: |
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Lint (ruff)
        working-directory: agent-runtime
        run: ruff check .

      - name: Compile-check
        working-directory: agent-runtime
        run: python -m compileall -q .

      - name: Unit tests (pytest)
        working-directory: agent-runtime
        run: python -m pytest
