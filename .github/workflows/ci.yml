name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  typescript:
    name: TypeScript + CDK synth
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npx tsc --noEmit

      - name: CDK synth
        run: npx cdk synth --context stage=ci --quiet

  python:
    name: Python (agent-runtime)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: agent-runtime/requirements.txt

      - name: Install dependencies
        working-directory: agent-runtime
        run: pip install -r requirements.txt

      - name: Compile-check
        working-directory: agent-runtime
        run: python -m compileall -q .
